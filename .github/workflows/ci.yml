name: Qualidade

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar lint, testes e build
        run: npm run check

      - name: Instalar Chromium para os testes de interface
        run: npx playwright install --with-deps chromium

      - name: Testar interface desktop, mobile e acessibilidade
        run: npm run test:e2e
