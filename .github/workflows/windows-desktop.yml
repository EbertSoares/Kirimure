name: Aplicativo Windows offline

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Validar testes e funcionamento offline
        run: |
          npm run check:offline
          npm run test:run

      - name: Gerar instalador Windows offline
        run: npm run desktop:build

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-digital-marinho-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
